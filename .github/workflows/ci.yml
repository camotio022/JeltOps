name: CI

on:
  push:
    branches:
      - feature/correcao-uptime
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check backend syntax
        run: node --check backend/monitor.js
      - name: Build frontend
        run: npm run build
      - name: Lint
        run: npm run lint
